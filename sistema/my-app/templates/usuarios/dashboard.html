<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 50px; background-color: #f9f9f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        .logout-btn { background: #dc3545; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>¡Bienvenido, {{ username }}!</h1>
    <p>Has iniciado sesión correctamente en el sistema.</p>
    
    <br>
    <a href="/logout" class="logout-btn">Cerrar Sesión</a>
</div>

</body>
</html>
