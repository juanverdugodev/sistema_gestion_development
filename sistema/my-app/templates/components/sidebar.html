<aside class="w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-700 shadow-xl p-3 gap-y-4 {% if show_global_anim %} animate-slide-left {% endif %}">
    
    <div class="p-5 text-xl font-bold text-white bg-slate-800 border border-slate-700 rounded-2xl flex items-center justify-center shadow-sm">
        <i class="fas fa-clock mr-3 text-brand-blue"></i> Gestión horaria
    </div>
    
    <nav class="flex-1 px-2 py-4 space-y-2 bg-slate-800 border border-slate-700 rounded-2xl shadow-sm">
        
        <a href="{{ url_for('main.home') }}"
           draggable="false" 
           class="flex items-center py-3 px-4 rounded-xl transition-all duration-200 text-sm
                  {% if request.endpoint == 'main.home' %} bg-slate-700 text-white font-semibold shadow-inner {% else %} text-slate-300 hover:bg-slate-700 hover:text-white {% endif %}">
            <i class="fa-solid fa-house w-6 text-brand-blue"></i> Inicio
        </a>

        <a href="{{ url_for('main.mark_day') }}"
           draggable="false"
           class="flex items-center py-3 px-4 rounded-lg transition-all duration-200 text-sm
                  {% if request.endpoint == 'main.mark_day' %} bg-slate-700 text-white font-semibold shadow-inner {% else %} text-slate-300 hover:bg-slate-700 hover:text-white {% endif %}">
            <i class="fa-solid fa-calendar-check w-6 text-brand-blue"></i>
            {% if session.rol == 'Administrador' %}
                Marcar jornada
            {% else %}
                Jornada
            {% endif %}
        </a>

        <a href="{{ url_for('main.view_calendar') }}"
            draggable="false"
            class="flex items-center py-3 px-4 rounded-xl transition-all duration-200 text-sm
                  {% if request.endpoint == 'main.view_calendar' %} bg-slate-700 text-white font-semibold shadow-inner {% else %} text-slate-300 hover:bg-slate-700 hover:text-white {% endif %}">
            <i class="fa-solid fa-calendar-days w-6 text-brand-blue"></i> Calendario
        </a>

        {% if session.rol == 'Administrador' %}
            
            <a href="{{ url_for('main.admin_user_records') }}"
               draggable="false"
               class="flex items-center py-3 px-4 rounded-xl transition-all duration-200 text-sm
                      {% if request.endpoint == 'main.admin_user_records' %} bg-slate-700 text-white font-semibold shadow-inner {% else %} text-slate-300 hover:bg-slate-700 hover:text-white {% endif %}">
                <i class="fa-solid fa-users-viewfinder w-6 text-brand-blue"></i> Registros funcionarios
            </a>

            <a href="{{ url_for('main.upload_xlsx_view') }}"
               draggable="false"
               class="flex items-center py-3 px-4 rounded-xl transition-all duration-200 text-sm
                      {% if request.endpoint == 'main.upload_xlsx_view' %} bg-slate-700 text-white font-semibold shadow-inner {% else %} text-slate-300 hover:bg-slate-700 hover:text-white {% endif %}">
                <i class="fa-solid fa-database w-6 text-brand-blue"></i> Cargar registros
            </a>
            
        {% endif %}

    </nav>

</aside>
